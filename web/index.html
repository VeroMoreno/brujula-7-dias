<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brújula · 7 días</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
  <main x-data="entriesApp()" x-cloak>
    <header>
      <div class="header-row">
        <h1>Brújula · 7 días</h1>
        <nav class="locale-switcher" :aria-label="t('locale.label')">
          <button
            type="button"
            @click="setLocale('es')"
            :class="{ active: locale === 'es' }"
            :aria-pressed="locale === 'es'"
            x-text="t('locale.es')"></button>
          <span aria-hidden="true">·</span>
          <button
            type="button"
            @click="setLocale('en')"
            :class="{ active: locale === 'en' }"
            :aria-pressed="locale === 'en'"
            x-text="t('locale.en')"></button>
        </nav>
      </div>
      <p class="lede" x-text="t('app.lede')"></p>
    </header>

    <section x-show="!journey.complete || editing !== null" aria-labelledby="today-question">
      <p class="today-label"
         x-text="editing !== null ? t('journey.editingLabel', { day: editing }) : t('journey.todayLabel', { day: journey.day })"></p>
      <h2 id="today-question" class="question-prompt" x-text="editing !== null ? editQuestion : question"></h2>

      <form @submit.prevent="submit()">
        <label>
          <span class="visually-hidden" x-text="t('form.content')"></span>
          <textarea
            x-model="form.content"
            :placeholder="t('form.placeholder.content')"
            required
            rows="6"></textarea>
        </label>

        <div class="form-actions">
          <button type="submit" :disabled="saving">
            <span x-text="saving ? t('form.saving') : (editing !== null ? t('form.update') : t('form.submit'))"></span>
          </button>
          <button
            type="button"
            class="link-muted"
            x-show="editing !== null"
            @click="cancelEdit()"
            x-text="t('form.cancelEdit')"></button>
        </div>

        <p class="error" role="alert" x-show="error" x-text="error"></p>
      </form>
    </section>

    <section x-show="journey.complete" aria-labelledby="complete-title" class="journey-complete">
      <h2 id="complete-title" class="question-prompt" x-text="t('journey.completeTitle')"></h2>
      <p class="muted" x-text="t('journey.completeNote')"></p>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title" x-text="t('list.title')"></h2>

      <p x-show="loading" class="muted" x-text="t('list.loading')"></p>
      <p x-show="!loading && entries.length === 0" class="muted" x-text="t('list.empty')"></p>

      <template x-for="entry in entries" :key="entry.day">
        <article>
          <h3>
            <span x-text="t('entry.dayLabel')"></span>
            <span x-text="entry.day"></span>
            <span class="muted">· <span x-text="entry.date"></span></span>
          </h3>
          <p class="question" x-text="entry.question"></p>
          <p class="content" x-text="entry.content"></p>
          <div class="entry-actions">
            <button
              type="button"
              class="link-action"
              @click="edit(entry)"
              x-text="t('entry.edit')"></button>
            <button
              type="button"
              class="link-danger"
              @click="remove(entry.day)"
              x-text="t('entry.delete')"></button>
          </div>
        </article>
      </template>
    </section>
  </main>

  <script>
    function entriesApp() {
      return {
        locale: 'es',
        messages: {},
        journey: { day: 1, startedAt: null, complete: false },
        question: '',
        entries: [],
        loading: true,
        saving: false,
        error: '',
        editing: null,
        editQuestion: '',
        form: { content: '' },

        async init() {
          const stored = localStorage.getItem('brujula-locale');
          const auto = navigator.language?.toLowerCase().startsWith('en') ? 'en' : 'es';
          this.locale = stored || auto;
          document.documentElement.lang = this.locale;
          await this.loadMessages();
          await this.loadJourney();
          await this.loadQuestion();
          await this.load();
          this.$watch('locale', () => this.loadQuestion());
        },

        t(key, params = {}) {
          const value = key.split('.').reduce((acc, k) => acc?.[k], this.messages);
          const template = typeof value === 'string' ? value : key;
          return Object.entries(params).reduce(
            (s, [k, v]) => s.replaceAll(`{${k}}`, String(v)),
            template
          );
        },

        async setLocale(next) {
          if (next === this.locale) return;
          this.locale = next;
          localStorage.setItem('brujula-locale', next);
          document.documentElement.lang = next;
          await this.loadMessages();
        },

        async loadMessages() {
          try {
            const res = await fetch(`/api/messages?locale=${encodeURIComponent(this.locale)}`);
            if (!res.ok) throw new Error('messages fetch failed');
            const payload = await res.json();
            this.messages = payload.messages ?? {};
          } catch {
            this.messages = {};
          }
        },

        async loadJourney() {
          try {
            const res = await fetch('/api/journey');
            if (!res.ok) throw new Error('journey fetch failed');
            this.journey = await res.json();
          } catch {
            this.journey = { day: 1, startedAt: null, complete: false };
          }
        },

        async loadQuestion() {
          try {
            const res = await fetch(
              `/api/questions/${this.journey.day}?locale=${encodeURIComponent(this.locale)}`
            );
            if (!res.ok) return;
            const payload = await res.json();
            if (typeof payload.question === 'string') {
              this.question = payload.question;
            }
          } catch {
            // mantiene la pregunta actual
          }
        },

        async load() {
          this.loading = true;
          this.error = '';
          try {
            const res = await fetch('/api/entries');
            if (!res.ok) throw new Error(this.t('errors.load'));
            this.entries = await res.json();
          } catch (err) {
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        },

        edit(entry) {
          this.editing = entry.day;
          this.editQuestion = entry.question;
          this.form.content = entry.content;
          this.error = '';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        },

        cancelEdit() {
          this.editing = null;
          this.editQuestion = '';
          this.form.content = '';
          this.error = '';
        },

        async remove(day) {
          if (!confirm(this.t('entry.deleteConfirm', { day }))) return;
          this.error = '';
          try {
            const res = await fetch(`/api/entries/${day}`, { method: 'DELETE' });
            if (!res.ok) {
              const payload = await res.json().catch(() => ({}));
              throw new Error(payload.error || this.t('errors.delete'));
            }
            await this.loadJourney();
            await this.loadQuestion();
            await this.load();
          } catch (err) {
            this.error = err.message;
          }
        },

        async submit() {
          this.saving = true;
          this.error = '';
          try {
            const res = await fetch('/api/entries', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                day: this.editing !== null ? this.editing : this.journey.day,
                question: this.editing !== null ? this.editQuestion : this.question,
                content: this.form.content,
              }),
            });
            if (!res.ok) {
              const payload = await res.json().catch(() => ({}));
              throw new Error(payload.error || this.t('errors.save'));
            }
            this.form.content = '';
            this.editing = null;
            this.editQuestion = '';
            await this.loadJourney();
            await this.loadQuestion();
            await this.load();
          } catch (err) {
            this.error = err.message;
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
</body>
</html>
