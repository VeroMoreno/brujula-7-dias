<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brújula · 7 días</title>
  <link rel="stylesheet" href="/styles.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</head>
<body>
  <main x-data="entriesApp()" x-cloak>
    <header>
      <div class="header-row">
        <h1>Brújula · 7 días</h1>
        <nav class="locale-switcher" :aria-label="t('locale.label')">
          <button
            type="button"
            @click="setLocale('es')"
            :class="{ active: locale === 'es' }"
            :aria-pressed="locale === 'es'"
            x-text="t('locale.es')"></button>
          <span aria-hidden="true">·</span>
          <button
            type="button"
            @click="setLocale('en')"
            :class="{ active: locale === 'en' }"
            :aria-pressed="locale === 'en'"
            x-text="t('locale.en')"></button>
        </nav>
      </div>
      <p class="lede" x-text="t('app.lede')"></p>
    </header>

    <section aria-labelledby="form-title">
      <h2 id="form-title" x-text="t('form.title')"></h2>

      <form @submit.prevent="submit()">
        <label>
          <span x-text="t('form.day')"></span>
          <select x-model.number="form.day">
            <template x-for="n in 7" :key="n">
              <option :value="n" x-text="n"></option>
            </template>
          </select>
        </label>

        <p class="hint" x-show="existingForDay(form.day)" x-text="t('form.overwrite', { day: form.day })"></p>

        <label>
          <span x-text="t('form.question')"></span>
          <input
            type="text"
            x-model="form.question"
            :placeholder="t('form.placeholder.question')"
            required
            maxlength="200">
        </label>

        <label>
          <span x-text="t('form.content')"></span>
          <textarea
            x-model="form.content"
            :placeholder="t('form.placeholder.content')"
            required
            rows="6"></textarea>
        </label>

        <button type="submit" :disabled="saving">
          <span x-text="saving ? t('form.saving') : t('form.submit')"></span>
        </button>

        <p class="error" role="alert" x-show="error" x-text="error"></p>
      </form>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title" x-text="t('list.title')"></h2>

      <p x-show="loading" class="muted" x-text="t('list.loading')"></p>
      <p x-show="!loading && entries.length === 0" class="muted" x-text="t('list.empty')"></p>

      <template x-for="entry in entries" :key="entry.day">
        <article>
          <h3>
            <span x-text="t('entry.dayLabel')"></span>
            <span x-text="entry.day"></span>
            <span class="muted">· <span x-text="entry.date"></span></span>
          </h3>
          <p class="question" x-text="entry.question"></p>
          <p class="content" x-text="entry.content"></p>
        </article>
      </template>
    </section>
  </main>

  <script>
    function entriesApp() {
      return {
        locale: 'es',
        messages: {},
        entries: [],
        loading: true,
        saving: false,
        error: '',
        form: { day: 1, question: '', content: '' },

        async init() {
          const stored = localStorage.getItem('brujula-locale');
          const auto = navigator.language?.toLowerCase().startsWith('en') ? 'en' : 'es';
          this.locale = stored || auto;
          document.documentElement.lang = this.locale;
          await this.loadMessages();
          await this.load();
          await this.loadQuestion();
          this.$watch('form.day', () => this.loadQuestion());
          this.$watch('locale', () => this.loadQuestion());
        },

        async loadQuestion() {
          try {
            const res = await fetch(
              `/api/questions/${this.form.day}?locale=${encodeURIComponent(this.locale)}`
            );
            if (!res.ok) return;
            const payload = await res.json();
            if (typeof payload.question === 'string') {
              this.form.question = payload.question;
            }
          } catch {
            // Mantén el valor actual del input si la red falla.
          }
        },

        t(key, params = {}) {
          const value = key.split('.').reduce((acc, k) => acc?.[k], this.messages);
          const template = typeof value === 'string' ? value : key;
          return Object.entries(params).reduce(
            (s, [k, v]) => s.replaceAll(`{${k}}`, String(v)),
            template
          );
        },

        async setLocale(next) {
          if (next === this.locale) return;
          this.locale = next;
          localStorage.setItem('brujula-locale', next);
          document.documentElement.lang = next;
          await this.loadMessages();
        },

        async loadMessages() {
          try {
            const res = await fetch(`/api/messages?locale=${encodeURIComponent(this.locale)}`);
            if (!res.ok) throw new Error('messages fetch failed');
            const payload = await res.json();
            this.messages = payload.messages ?? {};
          } catch (err) {
            // Mensajes vacíos: t() devuelve la clave como fallback visible.
            this.messages = {};
          }
        },

        async load() {
          this.loading = true;
          this.error = '';
          try {
            const res = await fetch('/api/entries');
            if (!res.ok) throw new Error(this.t('errors.load'));
            this.entries = await res.json();
          } catch (err) {
            this.error = err.message;
          } finally {
            this.loading = false;
          }
        },

        existingForDay(day) {
          return this.entries.some((e) => e.day === day);
        },

        async submit() {
          this.saving = true;
          this.error = '';
          try {
            const res = await fetch('/api/entries', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify(this.form),
            });
            if (!res.ok) {
              const payload = await res.json().catch(() => ({}));
              throw new Error(payload.error || this.t('errors.save'));
            }
            this.form = { day: this.form.day, question: '', content: '' };
            await this.loadQuestion();
            await this.load();
          } catch (err) {
            this.error = err.message;
          } finally {
            this.saving = false;
          }
        },
      };
    }
  </script>
</body>
</html>
